{% extends "layout.html" %}
{% block title %}Confirmar exclusão{% endblock %}
{% block content %}
<div class="card border-danger-subtle" style="max-width:560px">
  <div class="card-body">
    <h1 class="h5 text-danger"><i class="bi bi-exclamation-triangle me-1"></i>Confirmar exclusão</h1>
    <p class="mb-3">Tem certeza de que deseja excluir <strong>“{{ object }}”</strong>? Esta ação não pode ser desfeita.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">Sim, excluir</button>
      <a class="btn btn-light" href="{{ cancel_url }}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
