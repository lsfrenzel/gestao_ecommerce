{% extends "layout.html" %}
{% block title %}Alterar senha{% endblock %}
{% block content %}
<div class="page-header"><h1>Alterar senha</h1></div>
<div class="card" style="max-width:520px"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn-primary">Alterar senha</button>
    <a class="btn btn-light" href="{% url 'accounts:profile' %}">Cancelar</a>
  </form>
</div></div>
{% endblock %}
