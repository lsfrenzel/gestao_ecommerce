{% extends "platform/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ title }}</h1></div>
<div class="card" style="max-width:820px"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/form_errors.html" %}
    <div class="row">{% for field in form %}{% include "partials/field.html" with col="col-md-6" %}{% endfor %}</div>
    <button class="btn btn-primary">Salvar</button> <a class="btn btn-light" href="{% url back %}">Cancelar</a>
  </form>
</div></div>
{% endblock %}
